<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 · Página não encontrada</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            color: #e7e9f1;
            background: radial-gradient(900px 480px at 12% -8%, rgba(124, 92, 255, .18), transparent 60%), #0e1016;
        }
        .box { max-width: 520px; text-align: center; }
        .code { font-size: 74px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #7c5cff, #ff5c8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h1 { font-size: 22px; margin: 14px 0 6px; }
        p { color: #98a0b6; margin: 0 0 24px; }
        a {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            color: #fff;
            background: #7c5cff;
        }
        a:hover { background: #6a49f2; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>{{ message|default('O endereço acessado não existe ou foi movido.') }}</p>
        <a href="/admin">Voltar ao painel</a>
    </div>
</body>
</html>
