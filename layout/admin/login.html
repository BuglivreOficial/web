<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    {% include 'admin/partials/head.html' %}
    <title>Acessar painel · Manga Admin</title>
</head>
<body class="auth-body">

    <div class="progress" id="loginProgress" aria-hidden="true"><span class="progress__bar"></span></div>

    <button class="icon-btn auth-theme" id="themeToggle" type="button" aria-label="Alternar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

    <main class="auth">
        <section class="auth__card">
            <div class="auth__brand">
                <span class="sidebar__logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </span>
                <span><strong>Manga</strong> Admin</span>
            </div>

            <h1 class="auth__title">Bem-vindo de volta</h1>
            <p class="auth__subtitle">Acesse o painel para gerenciar seu catálogo e capítulos.</p>

            <form class="auth__form" id="loginForm" method="post" novalidate>
                <div class="alert alert--error" id="loginAlert" role="alert"></div>

                <label class="field">
                    <span class="field__label">Usuário</span>
                    <span class="field__control">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input type="text" name="username" placeholder="seu usuário" autocomplete="username" data-rules="required|min:3" required>
                    </span>
                    <span class="field__error" aria-live="polite"></span>
                </label>

                <label class="field">
                    <span class="field__label">Senha</span>
                    <span class="field__control">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" data-rules="required" required>
                        <button type="button" class="field__action" id="passwordToggle" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </span>
                    <span class="field__error" aria-live="polite"></span>
                </label>

                <div class="auth__row">
                    <label class="check">
                        <input type="checkbox" name="remember" value="1">
                        <span>Lembrar-me</span>
                    </label>
                    <a class="auth__link" href="/admin/recuperar">Esqueceu a senha?</a>
                </div>

                <button class="btn btn--primary btn--block" type="submit">
                    <span class="btn__label">Entrar no painel</span>
                </button>
            </form>

            <p class="auth__foot">© <span id="year">2026</span> Manga Admin · Todos os direitos reservados</p>
        </section>
    </main>

    {% include 'admin/partials/footer.html' %}
</body>
</html>
